# Portable Windows release of a tag. Pushing a tag v* (or Actions → Release → Run
# workflow with an existing tag) builds decsat-gui.exe and decsat.exe with the static
# C runtime and the HackRF front end (pure Rust over USB: no DLLs), checks that their
# versions match the tag and that they need no C runtime DLL, smoke-tests the command
# line on a synthetic capture, writes the test signals (`decsat test-signals`) and
# checks the DVB-CID one decodes, and uploads the exes and the test signals with their
# SHA-256 to a draft release of the tag. Then write the release notes and publish it:
#
#   gh release edit vX.Y.Z --notes-file notes.md --draft=false --latest
#
# A release that is already published is never touched: the job fails instead. A trial
# run without a release: `gh workflow run release.yml -f tag=main -f upload=false`.
# (Pattern from DecDRM's release workflow.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (vX.Y.Z), or a branch for a trial run without upload
        required: true
      upload:
        description: Upload the executables to a draft release of the tag
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          # libopus (third_party/opus), built by decsat-opus-sys.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build (static C runtime, HackRF front end)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: >-
          cargo build --release --target x86_64-pc-windows-msvc -p decsat-gui -p decsat-cli
      - name: Check (versions, no C runtime DLL, command-line smoke test)
        shell: bash
        run: |
          set -euo pipefail
          bin=target/x86_64-pc-windows-msvc/release
          "$bin/decsat" --version
          "$bin/decsat-gui" --version
          if [[ $TAG == v* ]]; then
            test "$("$bin/decsat" --version)" = "decsat ${TAG#v}"
            test "$("$bin/decsat-gui" --version)" = "decsat-gui ${TAG#v}"
          fi
          for exe in decsat decsat-gui; do
            if grep -a -q -i -e vcruntime140 -e api-ms-win-crt "$bin/$exe.exe"; then
              echo "$exe.exe imports a C runtime DLL: not a static build" >&2
              exit 1
            fi
          done
          "$bin/decsat" modcods > /dev/null
          scene="$RUNNER_TEMP/decsat-scene_8Msps.cs8"
          "$bin/decsat" scene "$scene" --seconds 2
          "$bin/decsat" scan "$scene" --timeout 120 | tee "$RUNNER_TEMP/scan.txt"
          grep -q -i "DVB-S2" "$RUNNER_TEMP/scan.txt"
          # The test signals for the release, and the CID one read back.
          "$bin/decsat" test-signals test-signals
          "$bin/decsat" decode test-signals/decsat-cid_3360000sps.cs8 --decoder cid \
            --offset 700000 --bandwidth 1500000 --fast | tee "$RUNNER_TEMP/cid.txt"
          grep -q "75:00:06:B0:FF:FF:01:AC:07" "$RUNNER_TEMP/cid.txt"
      - name: Draft release
        if: github.event_name == 'push' || inputs.upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin=target/x86_64-pc-windows-msvc/release
          cp "$bin/decsat-gui.exe" "$bin/decsat.exe" .
          mv test-signals/decsat-scene_8Msps.cs8 test-signals/decsat-cid_3360000sps.cs8 .
          files=(decsat-gui.exe decsat.exe decsat-scene_8Msps.cs8 decsat-cid_3360000sps.cs8)
          cat > notes.md <<'EOF'
          Portable Windows executables for 64-bit Windows 10/11, nothing to install (static C runtime).

          | File | What |
          |---|---|
          | `decsat-gui.exe` | Desktop app: wideband waterfall with VFOs (DVB-S2/S2X → GSE/IP or MPEG-TS, DVB-S, satellite modems, DVB-CID, generic PSK/QAM, IQ record), IQ files or a HackRF One; a DVB-S2/S2X transmitter (MPEG-TS to the HackRF or a file) |
          | `decsat.exe` | Command line: `decsat scan`, `decsat decode`, `decsat analyse`, `decsat scene`, `decsat cid`, `decsat test-signals`, `decsat tx`, `decsat record`, `decsat modcods` |
          | `decsat-scene_8Msps.cs8` | Test signal, 8 MS/s, 4 s: DVB-S2 (IP over GSE, and an S2X ACM carrier with MPEG-TS), DVB-S, a TPC 2964 modem carrier and a CW tone |
          | `decsat-cid_3360000sps.cs8` | Test signal, 3.36 MS/s, 30 s: DVB-S2 QPSK 1/2 at +700 kHz with a DVB-CID under it (identifier and position decode) |

          Open a test signal in the GUI (Open IQ…; the sample rate is in the file name) and click a carrier, or run `decsat test-signals` to make them yourself ([tests/README.md](https://github.com/CasualArclamp/DecSAT/blob/main/tests/README.md)).

          A HackRF One needs no DLLs (it transmits only when armed: see the README); on Windows it must use the WinUSB driver (Zadig, or the one the official HackRF tools install). IQ files need nothing.
          Windows SmartScreen may warn on first start because the files are unsigned ("More info" → "Run anyway").
          EOF
          {
            echo
            echo "Built from $(git rev-parse --short HEAD) by [GitHub Actions]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "SHA-256:"
            echo '```'
            # (Git Bash's sha256sum marks binary mode with a star: "hash *file".)
            sha256sum "${files[@]}" | sed 's/ \*/  /'
            echo '```'
          } >> notes.md
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" != true ]; then
              echo "release $TAG is already published: not replacing its files" >&2
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "DecSAT ${TAG#v} (Windows portable)" \
              --notes-file notes.md "${files[@]}"
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
