# made by CasualArclamp
[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.10.15"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/CasualArclamp/DecSAT"
rust-version = "1.88"

[workspace.dependencies]
num-complex = "0.4.6"
rustfft = "6.4"
thiserror = "2"
anyhow = "1"
tracing = "0.1"

# DSP is unusably slow unoptimised; keep dev builds fast enough to decode real
# captures in tests while still compiling quickly (same tradeoff as DecDRM).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The LDPC decoder's inner loops only vectorise when optimised; at opt-level 1
# a single normal frame takes seconds and the FEC tests crawl.
[profile.dev.package.decsat-fec]
opt-level = 3

[profile.release]
debug = "line-tables-only"
lto = "thin"
