# made by CasualArclamp
[package]
name = "qo100-beacon"
description = "QO-100's 400 bit/s PSK beacon from a sound card: frames, text and housekeeping values"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# eframe/egui 0.36 need Rust 1.95, so the GUI cannot keep the workspace MSRV.
rust-version = "1.95"

[dependencies]
decsat-core = { path = "../../crates/decsat-core" }
decsat-io = { path = "../../crates/decsat-io" }
decsat-modem = { path = "../../crates/decsat-modem" }
cpal = "0.18.2"
rustfft.workspace = true
# The glow (OpenGL) renderer, as the other apps: much smaller than wgpu.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# Native file dialog for opening a recording.
rfd = "0.17.2"
# PNG output for --screenshot.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
# The exe's icon (a Windows resource).
winresource = "0.1"

# eframe's defaults turn on winit's defaults; with them off they come back
# here (Linux only), so building needs no X11/Wayland dev packages.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"
