# made by CasualArclamp
[package]
name = "decsat-tx-app"
description = "DecSAT transmitter (egui): a camera or file, encoded live, to a DVB-S2/S2X carrier for QO-100 DATV"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# eframe/egui 0.36 need Rust 1.95, so the GUI cannot keep the workspace MSRV.
rust-version = "1.95"

# The package and the library are both "decsat-tx": two packages in one
# workspace cannot share a name, so the app is `decsat-tx-app` with the
# binary `decsat-tx` (as DecDVB-T's transmitter).
[[bin]]
name = "decsat-tx"
path = "src/main.rs"

[features]
# The HackRF driver is pure Rust (no SDK, no DLLs), so it is on by default.
default = ["hackrf", "pluto"]
hackrf = ["decsat-tx/hackrf"]
pluto = ["decsat-tx/pluto"]

[dependencies]
decsat-core = { path = "../../crates/decsat-core" }
decsat-mod = { path = "../../crates/decsat-mod" }
decsat-tx = { path = "../../crates/decsat-tx" }
# The glow (OpenGL) renderer instead of eframe's default wgpu: plenty for 2-D
# plots and a much smaller build. "x11"/"wayland" only matter on Linux.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# Native file dialogs (Win32 on Windows, XDG desktop portal on Linux).
rfd = "0.17.2"
# PNG output for --screenshot (documentation and smoke tests).
image = { version = "0.25.10", default-features = false, features = ["png"] }

# A release exe has no console window; it attaches to the one that started it,
# if any, so `--version` and the run summaries still print.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# eframe's defaults turn on winit's defaults; with eframe's defaults off we
# re-enable them here (Linux only), so building needs no X11/Wayland dev packages.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"
