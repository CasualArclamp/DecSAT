# made by CasualArclamp
[package]
name = "decsat-engine"
description = "DecSAT receive/transmit orchestration: ACM state, chain wiring, metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
decsat-core = { path = "../decsat-core" }
decsat-io = { path = "../decsat-io" }
decsat-dsp = { path = "../decsat-dsp" }
decsat-fec = { path = "../decsat-fec" }
decsat-frame = { path = "../decsat-frame" }
decsat-gse = { path = "../decsat-gse" }
decsat-ts = { path = "../decsat-ts" }
decsat-ip = { path = "../decsat-ip" }
decsat-audio = { path = "../decsat-audio" }
decsat-modem = { path = "../decsat-modem" }
decsat-bgan = { path = "../decsat-bgan" }
# DecAero's receiver for Inmarsat Classic Aero (same author, GPL-3), pinned
# to a release: its channel worker runs on a VFO's baseband (`aero.rs`).
# Cargo fetches the DecAero repository but builds only these crates and
# what they need (its codec, framing and DSP crates).
decaero-engine = { git = "https://github.com/CasualArclamp/DecAero", tag = "v0.3.1" }
decaero-core = { git = "https://github.com/CasualArclamp/DecAero", tag = "v0.3.1" }
decsat-mod = { path = "../decsat-mod" }
num-complex.workspace = true
rustfft.workspace = true
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true
