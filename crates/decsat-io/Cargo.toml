# made by CasualArclamp
[package]
name = "decsat-io"
description = "DecSAT I/O: IQ file replay/record and the HackRF, Fobos SDR, Airspy and ADALM-PLUTO front ends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Live HackRF One front end, in pure Rust over USB (nusb): no libhackrf, no
# libusb, no DLLs — the portable exe stays a single file. On Windows the HackRF
# must use the WinUSB driver (Zadig, or the in-box winusb.inf).
hackrf = ["dep:seify-hackrfone"]
# Live RigExpert Fobos SDR front end. RigExpert's C library (fobos_sdr.dll for
# the agile firmware, fobos.dll for the stock one) is loaded at run time, so
# nothing extra is needed to build, and only a Fobos user needs the file.
fobos = ["dep:libloading"]
# Live Airspy Mini / R2 front end, in pure Rust over USB (libairspy-rs on
# nusb): no libairspy, no DLLs; on Windows the WinUSB driver.
airspy = ["dep:libairspy-rs"]
# Live SDRplay RSP (RSPduo, RSP1A, RSPdx ...) front end. SDRplay's API library
# (sdrplay_api.dll, from the SDRplay installer) is loaded at run time, so
# nothing extra is needed to build.
sdrplay = ["dep:libloading"]
uhd = []
# Live ADALM-PLUTO / Pluto+ / LibreSDR front end, receive only: its IIOD
# protocol in pure Rust over USB (nusb, WinUSB) or TCP. No libiio, no DLLs.
pluto = ["dep:nusb", "dep:futures-lite"]
rtl = []

[dependencies]
decsat-core = { path = "../decsat-core" }
num-complex.workspace = true
thiserror.workspace = true
tracing.workspace = true
seify-hackrfone = { version = "0.2.2", optional = true }
libloading = { version = "0.8", optional = true }
libairspy-rs = { version = "0.2.1", optional = true }
# The versions seify-hackrfone and libairspy-rs already use, so the exe
# carries one copy.
nusb = { version = "0.1.14", optional = true }
futures-lite = { version = "2", optional = true }
